version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zerocarbonix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ewms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ewms_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-zerocarbonix_ewms}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ewms_admin} -d ${POSTGRES_DB:-zerocarbonix_ewms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zerocarbonix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z-cpuv1
    container_name: zerocarbonix-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zerocarbonix-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://ewms_admin:ewms_secure_pass_2026@postgres:5432/zerocarbonix_ewms?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: zc_jwt_access_super_secret_key_2026_x89a
      JWT_REFRESH_SECRET: zc_jwt_refresh_super_secret_key_2026_k91b
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio_admin
      S3_SECRET_KEY: minio_secure_pass_2026
      S3_BUCKET: zerocarbonix-vault
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: zerocarbonix-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
