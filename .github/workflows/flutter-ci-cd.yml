name: ENX Money Flutter CI/CD Pipeline

on:
  push:
    branches:
      - main
      - Revanth_dev
      - Revanth_Dev
      - Revath_Dev
      - piuysh_frontend_devloper
      - Anjali
    paths:
      - 'client/**'
      - '.github/workflows/flutter-ci-cd.yml'
  pull_request:
    branches:
      - main
      - Revanth_dev
      - Revanth_Dev
      - Revath_Dev
      - piuysh_frontend_devloper
      - Anjali
    paths:
      - 'client/**'
      - '.github/workflows/flutter-ci-cd.yml'

jobs:
  flutter-test-and-build:
    name: Flutter Analyze, Test & Release APK Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔍 Run Static Code Analysis
        run: flutter analyze

      - name: 🧪 Execute Flutter Unit & Widget Tests
        run: flutter test
        continue-on-error: true

      - name: 🔨 Build Android Release APK
        run: flutter build apk --release

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enx-money-release-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
