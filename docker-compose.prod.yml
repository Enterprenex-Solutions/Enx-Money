version: '3.8'

services:
  # 1. ENX Money Backend API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: enx_money_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=enx_user
      - DB_PASSWORD=enx_strong_prod_password_2026!
      - DB_NAME=enx_money_prod
      - JWT_SECRET=enx_money_production_jwt_secret_key_cloud_2026_secure
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
      - DEMO_OTP_ENABLED=false
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM="ENX Money Security" <${SMTP_USER}>
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-enx-money-production-documents}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - enx_internal_net

  # 2. Production MySQL 8.0 RDS Equivalent Service
  db:
    image: mysql:8.0
    container_name: enx_money_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=enx_root_master_pass_2026!
      - MYSQL_DATABASE=enx_money_prod
      - MYSQL_USER=enx_user
      - MYSQL_PASSWORD=enx_strong_prod_password_2026!
    ports:
      - "127.0.0.1:3306:3306" # Internal loopback only, never exposed to public WAN
    volumes:
      - enx_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "enx_user", "-penx_strong_prod_password_2026!"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enx_internal_net

volumes:
  enx_mysql_data:
    driver: local

networks:
  enx_internal_net:
    driver: bridge
