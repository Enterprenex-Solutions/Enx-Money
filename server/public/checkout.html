<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENX Money — Razorpay Standard Web Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Razorpay Standard Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    :root {
      --bg: #0B0F19;
      --card-bg: #111827;
      --card-border: #1F2937;
      --primary: #10B981;
      --primary-hover: #059669;
      --text: #F9FAFB;
      --text-muted: #9CA3AF;
      --danger: #EF4444;
      --success: #10B981;
      --warning: #F59E0B;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .checkout-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(16, 185, 129, 0.1);
      padding: 32px 28px;
      position: relative;
      overflow: hidden;
    }
    .checkout-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #10B981, #3B82F6, #8B5CF6);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10B981, #047857);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .title-group h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }
    .title-group p {
      font-size: 13px;
      color: var(--text-muted);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #10B981;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      padding: 4px 10px;
      margin-bottom: 20px;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .pill-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .pill-btn {
      background: #1F2937;
      border: 1px solid #374151;
      color: #E5E7EB;
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .pill-btn:hover {
      border-color: var(--primary);
    }
    .pill-btn.active {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--primary);
      color: #34D399;
    }
    .input-wrapper {
      position: relative;
    }
    .input-prefix {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-weight: 600;
    }
    input {
      width: 100%;
      background: #1F2937;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 12px 14px 12px 32px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--primary);
    }
    .input-text {
      padding-left: 14px;
      font-size: 14px;
      font-weight: 400;
    }
    .order-summary {
      background: rgba(31, 41, 55, 0.6);
      border: 1px dashed #374151;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 22px;
      font-size: 13px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: var(--text-muted);
    }
    .summary-row.total {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #374151;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .pay-btn {
      width: 100%;
      background: var(--primary);
      border: none;
      border-radius: 12px;
      color: #fff;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      transition: all 0.2s;
    }
    .pay-btn:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .pay-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status-alert {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 13px;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .status-alert.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34D399;
    }
    .status-alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
    }
    .status-alert.warning {
      display: block;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #FBBF24;
    }
    .status-title {
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .code-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 10px;
      border-radius: 8px;
      margin-top: 8px;
      font-family: monospace;
      font-size: 11px;
      word-break: break-all;
    }
    .footer-secure {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="checkout-card">
    <div class="header">
      <div class="logo-badge">E</div>
      <div class="title-group">
        <h1>ENX Money</h1>
        <p>Razorpay Standard Web Checkout</p>
      </div>
    </div>

    <div class="badge">
      <span class="badge-dot"></span>
      <span>Live Gateway Integration • Bank OTP & UPI</span>
    </div>

    <!-- Amount Selection -->
    <div class="form-group">
      <label>Select Amount</label>
      <div class="pill-group">
        <button type="button" class="pill-btn active" data-amount="1" onclick="selectAmount(1)">₹1 (Min)</button>
        <button type="button" class="pill-btn" data-amount="499" onclick="selectAmount(499)">₹499 (Pro)</button>
        <button type="button" class="pill-btn" data-amount="999" onclick="selectAmount(999)">₹999 (Biz)</button>
      </div>
      <div class="input-wrapper">
        <span class="input-prefix">₹</span>
        <input type="number" id="customAmount" value="1" min="1" step="1" oninput="onCustomAmountChange(this.value)" />
      </div>
    </div>

    <!-- Payer Info -->
    <div class="form-group">
      <label>Customer Name</label>
      <input type="text" id="custName" class="input-text" value="Rohit Samadhan Pawar" />
    </div>
    <div class="form-group">
      <label>Customer Email</label>
      <input type="email" id="custEmail" class="input-text" value="enxproductofficial@gmail.com" />
    </div>
    <div class="form-group">
      <label>Mobile Number</label>
      <input type="tel" id="custPhone" class="input-text" value="8767443493" />
    </div>

    <!-- Summary -->
    <div class="order-summary">
      <div class="summary-row">
        <span>Order Item:</span>
        <span id="summaryItem">ENX Money Subscription</span>
      </div>
      <div class="summary-row">
        <span>Currency:</span>
        <span>INR (₹)</span>
      </div>
      <div class="summary-row total">
        <span>Total Payable:</span>
        <span id="summaryTotal">₹1.00</span>
      </div>
    </div>

    <!-- Live Direct UPI Button (Official Razorpay.me) -->
    <a href="https://razorpay.me/@rohitsamadhanpawar4145" target="_blank" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: #fff; font-weight: 800; font-size: 15px; border-radius: 12px; text-decoration: none; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(16,185,129,0.35); text-align: center;">
      ⚡ Pay via Official Live UPI (GPay / PhonePe / Paytm) &rarr;
    </a>

    <!-- Pay Button -->
    <button type="button" id="payButton" class="pay-btn" onclick="startRazorpayCheckout()">
      <span class="spinner" id="paySpinner"></span>
      <span id="payBtnText">Pay ₹1.00 via Razorpay Modal</span>
    </button>

    <!-- Status Alert Container -->
    <div id="statusAlert" class="status-alert">
      <div class="status-title" id="statusTitle"></div>
      <div id="statusMessage"></div>
      <div class="code-box" id="statusCodeBox" style="display:none;"></div>
    </div>

    <div class="footer-secure">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <span>256-Bit SSL Encrypted • PCI-DSS Certified</span>
    </div>
  </div>

  <script>
    let currentAmountRupees = 1;

    function selectAmount(rupees) {
      currentAmountRupees = Number(rupees);
      document.getElementById('customAmount').value = rupees;
      document.querySelectorAll('.pill-btn').forEach(btn => {
        btn.classList.toggle('active', Number(btn.getAttribute('data-amount')) === Number(rupees));
      });
      updateDisplay();
    }

    function onCustomAmountChange(val) {
      const parsed = parseFloat(val);
      if (!isNaN(parsed) && parsed >= 1) {
        currentAmountRupees = parsed;
        document.querySelectorAll('.pill-btn').forEach(btn => {
          btn.classList.toggle('active', Number(btn.getAttribute('data-amount')) === parsed);
        });
        updateDisplay();
      }
    }

    function updateDisplay() {
      const formatted = `₹${currentAmountRupees.toFixed(2)}`;
      document.getElementById('summaryTotal').innerText = formatted;
      document.getElementById('payBtnText').innerText = `Pay ${formatted} via Razorpay`;
    }

    function showAlert(type, title, message, rawData = null) {
      const alert = document.getElementById('statusAlert');
      const titleEl = document.getElementById('statusTitle');
      const msgEl = document.getElementById('statusMessage');
      const codeEl = document.getElementById('statusCodeBox');

      alert.className = `status-alert ${type}`;
      titleEl.innerText = title;
      msgEl.innerText = message;

      if (rawData) {
        codeEl.style.display = 'block';
        codeEl.innerText = typeof rawData === 'string' ? rawData : JSON.stringify(rawData, null, 2);
      } else {
        codeEl.style.display = 'none';
      }
    }

    function setLoading(isLoading) {
      const btn = document.getElementById('payButton');
      const spinner = document.getElementById('paySpinner');
      btn.disabled = isLoading;
      spinner.style.display = isLoading ? 'inline-block' : 'none';
    }

    async function startRazorpayCheckout() {
      setLoading(true);
      showAlert('warning', 'Preparing Order...', 'Contacting server to generate Razorpay order...');

      if (typeof Razorpay === 'undefined') {
        setLoading(false);
        showAlert('error', 'Checkout SDK Error', 'Razorpay Checkout SDK is still loading. Please check your internet connection and refresh.');
        return;
      }

      const amountInPaise = Math.round(currentAmountRupees * 100);
      const name = document.getElementById('custName').value.trim();
      const email = document.getElementById('custEmail').value.trim();
      const phone = document.getElementById('custPhone').value.trim();

      const apiBase = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
        ? ''
        : 'https://enterprenex.solutions';

      try {
        // STEP 1: BACKEND - Call /api/create-order
        const orderResponse = await fetch(`${apiBase}/api/create-order`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
          },
          body: JSON.stringify({
            amount: amountInPaise,
            currency: 'INR',
            receipt: `rcpt_web_${Date.now()}`,
            notes: {
              customer_name: name,
              customer_email: email,
            },
          }),
        });

        const orderData = await orderResponse.json();

        if (!orderResponse.ok || !orderData.order_id) {
          throw new Error(orderData.error || orderData.details || 'Failed to create order on server');
        }

        showAlert('warning', 'Order Created', `Order ID: ${orderData.order_id}. Opening checkout modal...`);

        // STEP 2: FRONTEND - Open Razorpay Modal
        const options = {
          key: orderData.key_id || 'rzp_live_ThjlhbHvQ4iaQV',
          amount: orderData.amount,
          currency: orderData.currency || 'INR',
          name: 'ENX Money',
          description: `Subscription Payment (${document.getElementById('summaryTotal').innerText})`,
          order_id: orderData.order_id,
          prefill: {
            name: name,
            email: email,
            contact: phone,
          },
          theme: {
            color: '#10B981',
          },
          modal: {
            ondismiss: function () {
              setLoading(false);
              showAlert('warning', 'Payment Cancelled', 'Payment was not completed. No changes were made to your subscription.');
            },
          },
          handler: async function (response) {
            // STEP 3: BACKEND - Send signatures to /api/verify-payment
            showAlert('warning', 'Verifying Payment...', 'Verifying cryptographic HMAC signature on server...');
            setLoading(true);

            try {
              const verifyResponse = await fetch(`${apiBase}/api/verify-payment`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                },
                body: JSON.stringify({
                  order_id: response.razorpay_order_id,
                  payment_id: response.razorpay_payment_id,
                  razorpay_signature: response.razorpay_signature,
                }),
              });

              const verifyData = await verifyResponse.json();

              if (!verifyResponse.ok || !verifyData.success) {
                showAlert(
                  'error',
                  'Verification Failed',
                  verifyData.error || 'Server signature mismatch. Payment was not verified.',
                  verifyData
                );
              } else {
                showAlert(
                  'success',
                  'Payment Verified Successfully! 🎉',
                  `Payment ID: ${response.razorpay_payment_id}\nOrder ID: ${response.razorpay_order_id}\nSignature Verified via HMAC-SHA256.`,
                  {
                    status: 'SUCCESS',
                    payment_id: response.razorpay_payment_id,
                    order_id: response.razorpay_order_id,
                    verified: true,
                  }
                );
              }
            } catch (vErr) {
              showAlert('error', 'Verification Error', vErr.message);
            } finally {
              setLoading(false);
            }
          },
        };

        const rzp1 = new Razorpay(options);

        // Handle payment failure event
        rzp1.on('payment.failed', function (failedResponse) {
          setLoading(false);
          const err = failedResponse.error || {};
          showAlert(
            'error',
            'Payment Failed',
            `Reason: ${err.description || 'Unknown error'} (${err.code || 'UNKNOWN'})`,
            failedResponse
          );
        });

        rzp1.open();
      } catch (err) {
        setLoading(false);
        showAlert('error', 'Checkout Error', err.message);
      }
    }
  </script>
</body>
</html>
