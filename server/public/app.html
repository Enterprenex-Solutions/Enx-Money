<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="All-in-one Smart Business Khata, GST Invoicing, Ledger & Payment Management by Enterprenex Solutions.">
  <meta name="theme-color" content="#10141D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ENX Money">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ENX Money — Smart Business Khata, Invoicing & Financial Suite</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload core Flutter Web bundle and CanvasKit for fast 2-5 second load -->
  <link rel="preload" href="/flutter_bootstrap.js?v=202610041530" as="script">
  <link rel="preload" href="/main.dart.js?v=202610041530" as="script">
  <link rel="preload" href="/canvaskit/canvaskit.js" as="script">
  <link rel="preload" href="/canvaskit/canvaskit.wasm" as="fetch" crossorigin="anonymous">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #10141D;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    @keyframes enx-pulse {
      0% { left: -40%; width: 40%; }
      50% { left: 35%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }
  </style>
  <script>
    (function() {
      try {
        var path = window.location.pathname;
        var hash = window.location.hash;
        if (path === '/app' || path === '/app/' || path === '/web' || path === '/web/') {
          if (!hash || hash === '#' || hash === '') {
            window.location.replace(window.location.origin + path + (path.endsWith('/') ? '' : '/') + '#/');
          }
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="flutter-loader" style="position:fixed;top:0;left:0;right:0;bottom:0;background-color:#10141D;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;transition:opacity 0.35s ease-out;">
    <div style="width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#059669,#10b981);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(16,185,129,0.35);margin-bottom:20px;">
      <span style="font-size:30px;font-weight:900;color:#ffffff;letter-spacing:-1.5px;font-family:sans-serif;">E<span style="color:#a7f3d0;font-size:24px;">X</span></span>
    </div>
    <div style="font-size:20px;font-weight:800;color:#ffffff;letter-spacing:-0.4px;margin-bottom:6px;font-family:sans-serif;">ENX Money</div>
    <div style="font-size:13px;color:#94a3b8;margin-bottom:24px;font-family:sans-serif;">Web Application Loading...</div>
    <div style="width:180px;height:4px;background:#1e293b;border-radius:99px;overflow:hidden;position:relative;">
      <div style="position:absolute;top:0;left:0;bottom:0;width:40%;background:#10b981;border-radius:99px;animation:enx-pulse 1.3s infinite ease-in-out;"></div>
    </div>
  </div>
  <script>
    (function() {
      var dismissed = false;
      function dismissLoader() {
        if (dismissed) return;
        dismissed = true;
        var loader = document.getElementById('flutter-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(function() {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 350);
        }
      }

      window.addEventListener('flutter-first-frame', dismissLoader);

      // Fast observer: dismiss immediately when Flutter mounts its canvas/view into DOM
      var observer = new MutationObserver(function() {
        if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view') || document.querySelector('flt-scene-host')) {
          observer.disconnect();
          dismissLoader();
        }
      });
      observer.observe(document.body || document.documentElement, { childList: true, subtree: true });

      // Fallback: dismiss after 3.5s so user never waits more than 3.5s
      setTimeout(dismissLoader, 3500);
    })();
  </script>
  <script src="flutter_bootstrap.js?v=202610041530" async></script>
</body>
</html>
